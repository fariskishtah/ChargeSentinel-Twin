# Recommendation rule v4. Every score input is normalized to [0, 1]. Lower
# total scores are better. Wait, historical risk, and demand add cost; solar
# benefit reduces cost. Configured demand/solar values apply only when neither
# upstream forecasts nor candidate-level values are available.
version: recommendation-score-v4
weights:
  wait: 0.45
  anomaly_risk: 0.25
  demand_pressure: 0.20
  solar_benefit: 0.10
max_wait_minutes: 120
alternatives_limit: 3
prefer_free_if_available: true
mock_signals:
  source: neutral_placeholder_when_forecasts_are_missing_or_out_of_coverage
  demand_pressure: 0.5
  solar_benefit: 0.5
demand_pressure_saturation_sessions: 50.0
solar_reference_capacity_kw: 100.0
solar_reference_location: New Cairo
