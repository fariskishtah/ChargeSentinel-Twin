services:
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chargesentinel

  ui:
    build:
      context: .
      dockerfile: deployment/Dockerfile.ui
    environment:
      CHARGESENTINEL_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chargesentinel

  mlflow:
    build:
      context: .
      dockerfile: deployment/Dockerfile.mlflow
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - chargesentinel

networks:
  chargesentinel:
    driver: bridge

volumes:
  mlflow_data:
