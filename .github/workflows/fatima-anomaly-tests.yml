
name: Fatima Anomaly Detection Tests

on:
  push:
    branches:
      - feature/fatima-anomaly
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn catboost shap pytest

      - name: Run feature and inference tests
        run: |
          python -m pytest team/fatima_anomaly/tests -v
