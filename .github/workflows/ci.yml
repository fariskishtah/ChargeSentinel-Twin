name: Integration checks

on:
  push:
    branches: [feature/faris-integration, main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/api.txt -r requirements/ui.txt -r requirements/mlflow.txt -r requirements/dev.txt
      - run: python -m pytest tests/integration -q
